# Guidance for agents that write OpenSpec changes through the /opsx skills.
# Merge the `rules:` block below into the repository's openspec/config.yaml
# by hand, adding these lists to any `rules:` key it already has.
# `openspec instructions <artifact>` (OpenSpec 1.16.0 and later) shows each
# list to the agent writing that artifact, so the guidance reaches agents
# that never load spec-check. It is advice only: spec-check's checks and its
# consistency read still enforce the rules (spec-check's SKILL.md, Decision
# records).
rules:
  proposal:
    - The kinds of decision-record entry (Constraint, Rejected, Rationale), their formats and what counts as evidence are defined in spec-check's SKILL.md, section Decision records. A decision record is a capability's decisions.md, and you write entries in it as the rules below say; the next two rules give the evidence definition and the record format for when SKILL.md is unavailable.
    - Evidence, which is what decision-record entries rest on, is a failure (the bug or incident itself; a link to its regression test may follow, but the test is not the evidence), a measurement (an experiment someone ran) or an outside fact (such as a standard or a vendor's documentation). Each piece of evidence, as written in an entry, ends in a link to its source, such as a URL, an issue or pull request, a commit, or a path to a file in the repository. A test is never evidence, not even a requirement's own test, since it shows the rule is enforced, not why it is needed.
    - A decision record's first line is a level-1 heading whose text is the capability's folder name (under openspec/specs, or for a capability the change adds, under the change's specs), then a colon, then the phrase "constraints, rejected alternatives and rationale" exactly as quoted. Its entries sit under level-2 headings named exactly Constraints, Rejected and Rationale, in that order, each used at most once; a heading with no entries may be left out. Each entry is a list item starting with a hyphen. Its whole first line is bold and holds the entry's kind in the singular (Constraint, Rejected or Rationale), then a colon, then its title, all inside the bold; a Constraint's title names the rule and a Rejected entry's title names the approach. The rest of the entry is on lines indented under it, and a blank line ends the entry. A labelled line is the label in plain text, a colon and its text, and may wrap onto further indented lines. A Constraint entry has, in this order, one line each labelled Because (the rule's reason in one sentence), Evidence (a single line, which may wrap; several pieces go on it, separated by semicolons, each ending in its link), Holds while (the condition under which it still holds) and Paths (the files or directories it governs, relative to the repository root and separated by commas). A Rejected entry has, in this order, one line each labelled Facing (the problem the approach tried to solve), Lost because (one sentence a reader can check against its evidence, ending in the link to that evidence, which is the entry's only evidence), Instead (what was chosen) and Paths. A Rationale entry's title is its requirement's exact title; its reasoning comes first as unlabelled indented lines, then one or more lines labelled Evidence, one piece each, and it has no Paths line. A Rationale entry goes only in the record of its requirement's capability, and a requirement has at most one.
    - Before proposing an approach, read the spec and the decision record of each capability the change touches. The record is at openspec/specs/<capability>/decisions.md, unless openspec/spec-check.yaml has a decision-records key whose value is a path pattern with <capability> in it; the record is then at that pattern, relative to the repository root, with the capability's folder name in place of <capability>. A capability may have no record yet, and a capability the change adds has neither a spec nor a record until this pull request creates them. Only Rejected and Constraint entries stand against an approach, a Rejected entry when it turns that approach down and a Constraint entry when the approach would break its rule; a requirement the approach breaks is covered two rules below.
    - If a Rejected or Constraint entry stands against the approach, change that entry, in the pull request that carries this proposal, so that it no longer stands against the approach, with evidence for its new form; or delete it if it no longer holds or carries no evidence itself, since an entry without evidence does not belong in a record. If you can do neither, change the approach.
    - If the approach breaks a requirement, change or remove the requirement through the delta specs; that change needs no evidence, since a requirement's reasons and evidence live in its Rationale entry. Then, if the requirement has a Rationale entry, rewrite the entry with evidence for its new form, or delete it if the requirement is removed, the entry no longer holds, or you have no evidence for its new form (the requirement has already changed, so the old entry cannot stay).
    - Give the reason for each deletion, of a record entry or of a requirement, in the pull request description and the commit message, with the evidence for it when there is any.
    - Name each change to an entry or requirement, including additions and deletions, in the proposal's What Changes section.
    - proposal.md holds only Why and What Changes, in one or two pages. Why gives each reason the change is needed in one sentence, with no evidence. The proposal may link to a record entry, by linking the record file and naming the entry's title, but never directly to evidence. Reasoning that has no evidence and goes beyond those one-line reasons, including about design choices or a turned-down approach, goes in the Decisions section of the change's design.md, which you create when there is such reasoning. Evidence for a lasting rule goes in a decision record in the same pull request; create the record if it is missing, at that path even for a capability the change adds, creating its folder under openspec/specs. Evidence for a requirement (a rule in a spec, with a scenario a test checks) goes in that requirement's Rationale entry, which you create if it is missing. Evidence for a rule no test can check, which is never written as a requirement, goes in a Constraint entry. Evidence about a turned-down approach a test could catch (one that would make some test fail if someone used it) goes in the Rationale entry of the requirement that rules it out, adding that requirement through the delta specs if no requirement rules the approach out yet; evidence about a turned-down approach no test could catch goes in a Rejected entry. Evidence for the change itself rather than for a lasting rule, such as the issue that prompted it, goes in the pull request description.
  specs:
    - The kinds of decision-record entry (Constraint, Rejected, Rationale), their formats and what counts as evidence are defined in spec-check's SKILL.md, section Decision records. A decision record is a capability's decisions.md, and you write entries in it as the rules below say; the next two rules give the evidence definition and the record format for when SKILL.md is unavailable.
    - Evidence, which is what decision-record entries rest on, is a failure (the bug or incident itself; a link to its regression test may follow, but the test is not the evidence), a measurement (an experiment someone ran) or an outside fact (such as a standard or a vendor's documentation). Each piece of evidence, as written in an entry, ends in a link to its source, such as a URL, an issue or pull request, a commit, or a path to a file in the repository. A test is never evidence, not even a requirement's own test, since it shows the rule is enforced, not why it is needed.
    - A decision record's first line is a level-1 heading whose text is the capability's folder name (under openspec/specs, or for a capability the change adds, under the change's specs), then a colon, then the phrase "constraints, rejected alternatives and rationale" exactly as quoted. Its entries sit under level-2 headings named exactly Constraints, Rejected and Rationale, in that order, each used at most once; a heading with no entries may be left out. Each entry is a list item starting with a hyphen. Its whole first line is bold and holds the entry's kind in the singular (Constraint, Rejected or Rationale), then a colon, then its title, all inside the bold; a Constraint's title names the rule and a Rejected entry's title names the approach. The rest of the entry is on lines indented under it, and a blank line ends the entry. A labelled line is the label in plain text, a colon and its text, and may wrap onto further indented lines. A Constraint entry has, in this order, one line each labelled Because (the rule's reason in one sentence), Evidence (a single line, which may wrap; several pieces go on it, separated by semicolons, each ending in its link), Holds while (the condition under which it still holds) and Paths (the files or directories it governs, relative to the repository root and separated by commas). A Rejected entry has, in this order, one line each labelled Facing (the problem the approach tried to solve), Lost because (one sentence a reader can check against its evidence, ending in the link to that evidence, which is the entry's only evidence), Instead (what was chosen) and Paths. A Rationale entry's title is its requirement's exact title; its reasoning comes first as unlabelled indented lines, then one or more lines labelled Evidence, one piece each, and it has no Paths line. A Rationale entry goes only in the record of its requirement's capability, and a requirement has at most one.
    - A rule a test could check is a requirement with a scenario that checks it. To rule out an approach a test could catch (one that would make some test fail if someone used it), add a scenario the approach would fail. Put it under the requirement the approach breaks, or, if no requirement covers that behaviour, under a new requirement stating the behaviour chosen instead. Such an approach never gets a Rejected entry.
    - Evidence for a requirement, including for ruling out an approach, goes in that requirement's Rationale entry in the capability's decision record; add to the entry if it exists, or create it. When the change renames a requirement, retitle its Rationale entry to the new title; when it removes one, delete the entry. The record is at openspec/specs/<capability>/decisions.md, unless openspec/spec-check.yaml has a decision-records key whose value is a path pattern with <capability> in it; the record is then at that pattern, relative to the repository root, with the capability's folder name in place of <capability>. You edit that file directly in the pull request that carries the change, creating it if it is missing, at that path even for a capability the change adds; the change's own folder holds no decisions.md.
    - A rule no test can check, such as a cost policy or a choice of tool, is never a requirement. With evidence, such a rule is a Constraint entry in the record of each capability it governs. With evidence, an approach no test could catch is a Rejected entry in the record of each capability it concerns. Without evidence, either one goes, with its reasoning, in the Decisions section of the change's design.md, creating design.md or the section if it is missing.
    - A requirement may state one plain reason, with no evidence or link, beside its SHALL statement, as a because clause or as the sentence right after it, even when the same reason has evidence in a Rationale entry. Further reasoning without evidence, including why a testable approach was ruled out, goes in the Decisions section of the change's design.md.
  design:
    - The kinds of decision-record entry (Constraint, Rejected, Rationale), their formats and what counts as evidence are defined in spec-check's SKILL.md, section Decision records. A decision record is a capability's decisions.md, and you write entries in it as the rules below say; the next two rules give the evidence definition and the record format for when SKILL.md is unavailable.
    - Evidence, which is what decision-record entries rest on, is a failure (the bug or incident itself; a link to its regression test may follow, but the test is not the evidence), a measurement (an experiment someone ran) or an outside fact (such as a standard or a vendor's documentation). Each piece of evidence, as written in an entry, ends in a link to its source, such as a URL, an issue or pull request, a commit, or a path to a file in the repository. A test is never evidence, not even a requirement's own test, since it shows the rule is enforced, not why it is needed.
    - A decision record's first line is a level-1 heading whose text is the capability's folder name (under openspec/specs, or for a capability the change adds, under the change's specs), then a colon, then the phrase "constraints, rejected alternatives and rationale" exactly as quoted. Its entries sit under level-2 headings named exactly Constraints, Rejected and Rationale, in that order, each used at most once; a heading with no entries may be left out. Each entry is a list item starting with a hyphen. Its whole first line is bold and holds the entry's kind in the singular (Constraint, Rejected or Rationale), then a colon, then its title, all inside the bold; a Constraint's title names the rule and a Rejected entry's title names the approach. The rest of the entry is on lines indented under it, and a blank line ends the entry. A labelled line is the label in plain text, a colon and its text, and may wrap onto further indented lines. A Constraint entry has, in this order, one line each labelled Because (the rule's reason in one sentence), Evidence (a single line, which may wrap; several pieces go on it, separated by semicolons, each ending in its link), Holds while (the condition under which it still holds) and Paths (the files or directories it governs, relative to the repository root and separated by commas). A Rejected entry has, in this order, one line each labelled Facing (the problem the approach tried to solve), Lost because (one sentence a reader can check against its evidence, ending in the link to that evidence, which is the entry's only evidence), Instead (what was chosen) and Paths. A Rationale entry's title is its requirement's exact title; its reasoning comes first as unlabelled indented lines, then one or more lines labelled Evidence, one piece each, and it has no Paths line. A Rationale entry goes only in the record of its requirement's capability, and a requirement has at most one.
    - Anything a test could check, whether a constraint or an approach a test could catch (one that would make some test fail if someone used it), belongs in the change's specs as a requirement with a scenario; add it there if the specs lack it. It never goes in a Constraint or Rejected entry. design.md may refer to such a requirement but never restates its rule.
    - A reason for a requirement, a constraint no test can check, or an approach no test could catch goes in a decision record only when it has evidence. A reason for a requirement, including why an approach that would fail one of its scenarios lost, is that requirement's Rationale entry; a constraint no test can check is a Constraint entry; an approach no test could catch is a Rejected entry. The record is at openspec/specs/<capability>/decisions.md, unless openspec/spec-check.yaml has a decision-records key whose value is a path pattern with <capability> in it; the record is then at that pattern, relative to the repository root, with the capability's folder name in place of <capability>. A Constraint or Rejected entry goes, written in full, in the record of each capability whose requirements or behaviour it is about; a Rationale entry goes only in the record of its requirement's capability. You edit each record in the change's pull request, creating it if it is missing, at that path even for a capability the change adds. design.md may link to an entry but never restates it.
    - Without evidence, any of those three goes in design.md's Decisions section (the level-2 section of that name in OpenSpec's design template), with the change's other design choices, and never in the record; you create the section if it is missing. A requirement may have a one-line reason, with no evidence or link, beside its SHALL statement in the spec; that is the spec writer's choice, and design.md does not repeat it.
    - For each record entry you read while doing the change (you need not look through every entry), remove a piece of its evidence that is dead (its link no longer resolves) or disproved, and delete the entry when no sound evidence is left or when it no longer holds (a Constraint entry's Holds while condition has ended, a Rejected entry's Lost because no longer applies, or a Rationale entry's requirement is gone). Give the reason for each removal or deletion in the pull request description and the commit message, never in design.md or the record. Rewording an entry is not deleting it; it needs no reason in the pull request, and the entry keeps its evidence.
    - In any file of the change and in a decision record, never name who made a decision or when it was made, and never describe earlier drafts or review rounds of the change. design.md may describe the system as it is before the change, and a date of a fact, such as when a measurement was taken, may appear.

# Guidance for agents that write OpenSpec changes through the /opsx skills.
# Merge the `rules:` block below into the repository's openspec/config.yaml
# by hand, adding these lists to any `rules:` key it already has.
# `openspec instructions <artifact>` (OpenSpec 1.16.0 and later) shows each
# list to the agent writing that artifact, so the guidance reaches agents
# that never load spec-check. It is advice only: spec-check's checks and its
# consistency read still enforce the rules (spec-check's SKILL.md, Decision
# records).
rules:
  proposal:
    - Before proposing an approach, read the decision record of each capability the change touches (openspec/specs/<capability>/decisions.md, unless a decision-records line in openspec/spec-check.yaml puts records elsewhere). Do not bring back an approach the record rules out, in a Rejected entry or in a requirement's Rationale entry.
    - proposal.md stays one or two pages of why and what. Evidence for a rule, a constraint or a turned-down approach goes in the capability's decision record, never in the proposal, which may link to the record entry.
  specs:
    - A rule a test can check is written in the spec as a requirement with a scenario that checks it, never as a decision-record entry. So is the rejection of an approach, when a scenario would fail if the approach were used. Such a rejection becomes a requirement with that scenario, not a Rejected entry. Evidence for why a requirement exists, when there is any, goes in the capability's decision record as the requirement's Rationale entry. A rule no test can check goes in the record as a Constraint entry, with evidence.
    - Evidence is a failure (the bug or incident itself), a measurement (an experiment someone ran) or an outside fact, and each Evidence line ends in a link. A test alone, the requirement's own test included, is never evidence, since it shows the rule is enforced, not why it is needed.
    - A requirement holds its SHALL statement and at most one because sentence, a plain one-line reason with no evidence. A reason with evidence goes in a Rationale entry, however short, in the capability's decision record, edited directly in the same pull request. Any other reasoning without evidence, beyond the one because sentence the requirement may hold, goes in the Decisions section of the change's design.md, created if the change has none. Create the record if the capability has none; a change holds no decisions.md of its own.
  design:
    - A constraint no test can check, an alternative turned down, or a reason for a requirement goes in the capability's decision record when it has evidence, as a Constraint, Rejected or Rationale entry, edited in the same pull request. It never goes in design.md, which may link to the record entry.
    - Evidence is a failure (the bug or incident itself, with its regression test as a further pointer), a measurement (an experiment someone ran), or an outside fact, and each Evidence line ends in a link (a URL, an issue or pull request, a commit, or a markdown link to a file). A test alone, the requirement's own test included, is never evidence, since it shows the rule is enforced, not why it is needed.
    - Without evidence, a constraint or a reason for a requirement stays in design.md's Decisions section.
    - A rejection that a requirement guards against (one its scenario would fail) is written as that requirement's Rationale, with evidence. Otherwise it is a Rejected entry in the decision record, whose Lost because line (the reason the alternative lost) carries the link to its evidence; such a rejection with no evidence is deleted, not recorded. A Rationale entry is optional; a requirement needs none. Reasoning without evidence for a requirement, including for a rejection it guards against, goes in design.md's Decisions section.
    - Never give who decided, or when, as a reason.

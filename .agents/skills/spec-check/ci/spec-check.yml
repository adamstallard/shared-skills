# spec-check's workflow checks that every OpenSpec change a pull request
# adds or edits has had a consistency read since its last edit. A
# consistency read is a step of the spec-check skill: before a pull request
# goes to a person for review, a fresh agent reads each such change against
# the repository's other specs and changes.
#
# Whoever wrote the change, a person or an agent, records that read by
# committing with a `Spec-check:` trailer, printed by `spec_check.py sign`,
# that names the changes read. The trailer is the only record of a read. A
# change the pull request adds or edits (a folder under openspec/changes)
# is unread when no commit in the history of the pull request's head has a
# trailer naming that change, or when the change's files have changed since
# the newest commit whose trailer names it.
#
# When every change has been read, the `spec-check` check passes and the
# pull request is left alone. When a change is unread, what the script does
# depends on the event and on whether the pull request is a draft.
#
# A ready pull request:
# - opened, reopened, ready_for_review: each puts it in front of a reviewer,
#   for the first time or again. The check fails, and the script makes the
#   pull request a draft.
# - review_requested: the same, and the script also withdraws that review
#   request.
# - synchronize (a push to the branch): the check fails, but the pull
#   request stays ready. An agent often pushes several times before doing
#   the read. If each push made the pull request a draft, the agent or a
#   person would mark it ready again, and the next push would make it a
#   draft again.
#
# A pull request that `spec_check.py ci` (the script this workflow runs)
# made a draft earlier stays a draft until someone marks it ready.
#
# A draft pull request:
# - review_requested: the check fails, and the script withdraws that review
#   request. The pull request stays a draft.
# - opened, reopened, synchronize: the check passes even with a change
#   unread, because no one is yet asked to review it. The check runs again
#   when the pull request is marked ready.
#
# When the base branch's protection rules require `spec-check`, a failed
# check blocks the merge.
#
# The script makes the draft and withdraws the request through gh, with the
# GH_TOKEN below and the `pull-requests: write` permission. If someone
# removed either from this file, the check would still fail but the pull
# request would be left as it is. The same happens on a pull request from a
# fork, because GitHub gives the workflow only a read-only token there.
#
# Where the script comes from: each run downloads spec_check.py from
# adamstallard/shared-skills at the commit SPEC_CHECK_SHA names, below. That
# commit is the pin. The download always works at a commit on main, meaning
# any commit in main's history, including one on a branch merged into main.
# At a commit never pushed to GitHub it never works, so the check fails. At
# a commit on another branch it can stop working once that branch is
# deleted, because GitHub may stop serving a commit that no branch reaches.
# Whether it works at a commit pushed only to a fork of
# adamstallard/shared-skills is untested. So the pin must be a commit on
# main.
#
# How the pin is chosen: spec_check.py's setup-ci command writes this
# workflow as .github/workflows/spec-check.yml, into the git repository
# named by `--repo <dir>` or else the one holding the current directory.
# It works out the pin from adamstallard/shared-skills' commit history
# on GitHub, through gh, and copies this workflow from the template as
# committed at the pin, so the workflow's steps and the spec_check.py
# each run downloads come from the same commit. The pin holds the newest
# versions of both spec_check.py and the template
# (.agents/skills/spec-check/ci/spec-check.yml). To find it, setup-ci
# takes, for each of the two files, the newest commit in main's history
# that changed that file:
# - When one of those two commits has the other in its history, the pin
#   is that one. It may sit on a merged branch rather than on main's
#   first-parent line.
# - When each file last changed on a branch of its own and the two
#   branches were merged separately, neither commit holds both. The pin
#   is then the earliest commit on main's first-parent line that holds
#   both: the merge of the branch that was merged second.
# So the pin moves only when a commit on main changes either file and
# someone runs `setup-ci --force` again. With `--sha <commit>` the pin is
# that commit instead, if GitHub confirms it is a full 40-character SHA of
# a commit on main; setup-ci writes nothing for any other value, such as a
# short SHA or a tag name. Whatever the pin, it writes nothing when gh is
# missing or signed out or GitHub cannot be reached.
#
# To update the pin, or this workflow:
# 1. Install gh, GitHub's command-line tool, and sign in with
#    `gh auth login`.
# 2. From inside the repository that holds this workflow, run setup-ci from
#    any copy of spec_check.py, such as the installed skill's:
#      python3 ~/.agents/skills/spec-check/scripts/spec_check.py \
#        setup-ci --force
#    `--force` replaces the whole file, discarding any local edit; without
#    it, setup-ci refuses to replace an existing workflow and changes
#    nothing. Add `--sha <commit>` to pin a commit on main other than the
#    default described above.
# 3. Commit .github/workflows/spec-check.yml.
#
# Editing a repository's .github/workflows/spec-check.yml by hand works,
# SPEC_CHECK_SHA included, as long as the pin stays a full 40-character SHA
# of a commit on main, but the edit lasts only until the next
# `setup-ci --force`, which discards it. An edit every repository should
# get goes in the template, by a pull request to adamstallard/shared-skills;
# once it merges, update as above.
name: spec-check
on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Every OpenSpec change was read since it last changed
        env:
          # The pin, which setup-ci writes here: a full commit SHA of
          # adamstallard/shared-skills, never a branch, so the script the
          # workflow runs cannot change under it.
          SPEC_CHECK_SHA: <SPEC_CHECK_SHA>
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/adamstallard/shared-skills/$SPEC_CHECK_SHA/.agents/skills/spec-check/scripts/spec_check.py" -o "$RUNNER_TEMP/spec_check.py"
          python3 "$RUNNER_TEMP/spec_check.py" ci

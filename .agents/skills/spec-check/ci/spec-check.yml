# spec-check's workflow checks that every OpenSpec change a pull request
# adds or edits has had a consistency read since its last edit. A
# consistency read is a step of the spec-check skill: before a pull request
# goes to a person for review, a fresh agent reads each such change against
# the repository's other specs and changes.
#
# Whoever wrote the change, a person or an agent, records the read by
# committing with a `Spec-check:` trailer, printed by `spec_check.py sign`,
# that names the changes read. The trailer is the only record of a read. A
# change under openspec/changes is unread when no commit in the history of
# the pull request's head has a trailer naming that change, or when the
# change's files have changed since the newest commit whose trailer names it.
#
# When no change is unread, the `spec-check` check passes and the pull
# request is left alone. When one is, what `spec_check.py ci` does depends
# on the event and on whether the pull request is a draft.
#
# A ready pull request:
# - opened, reopened, ready_for_review: each puts it in front of a reviewer,
#   for the first time or again. The check fails, and the script makes the
#   pull request a draft.
# - review_requested: the same, and the script also withdraws that review
#   request.
# - synchronize (a push to the branch): the check fails, but the pull
#   request stays ready. An agent often pushes several times before doing
#   the read, and a draft on each push would flip the pull request back and
#   forth.
#
# A draft pull request passes even with a change unread, because no one is
# yet asked to review it; the check runs again when it is marked ready. The
# exception is review_requested: the check fails and the script withdraws
# the review request. The script makes no other change to a draft.
#
# When the base branch's protection rules require `spec-check`, a failed
# check blocks the merge.
#
# The script makes the draft and withdraws the request through gh, with the
# GH_TOKEN below and the `pull-requests: write` permission. Without the
# token or the permission, the check still fails but the pull request is
# left as it is. The same happens on a pull request from a fork, because
# GitHub gives the workflow only a read-only token there.
#
# Where the script comes from: the workflow downloads spec_check.py from
# adamstallard/shared-skills at the commit named by SPEC_CHECK_SHA, below.
# That commit is the pin. In this template SPEC_CHECK_SHA holds a
# placeholder, which setup-ci replaces with the pin when it installs the
# workflow. The pin must be a commit GitHub can serve from
# adamstallard/shared-skills. A commit on its main branch always works. A
# commit never pushed to GitHub fails the download, and so the check. For
# any other commit, such as one pushed only to a fork, nothing here
# confirms that GitHub serves it.
#
# How the pin is set: `spec_check.py setup-ci` writes this workflow into a
# repository as .github/workflows/spec-check.yml. It copies the template
# .agents/skills/spec-check/ci/spec-check.yml from the shared-skills clone it
# runs from, so an out-of-date clone writes an out-of-date workflow. It sets
# the pin to the commit given with `--sha`, or else to the newest commit that
# changed spec_check.py in the history of the clone's checked-out branch.
# Without `--sha`, setup-ci writes the workflow only if that commit is on one
# of the clone's remote-tracking branches; otherwise it exits with an error
# and writes nothing. A remote-tracking branch shows that some remote has the
# commit, but that remote may be a fork, and the branch need not be main.
# With `--sha`, setup-ci checks only that the value is a full 40-character
# SHA. So neither check confirms the commit is on main. To confirm it, run
# this, with <sha> the SPEC_CHECK_SHA value in the installed workflow:
#   gh api repos/adamstallard/shared-skills/compare/main...<sha> --jq .status
# It prints `behind` (the commit is an ancestor of main) or `identical` (it
# is main's head) when the commit is on main. Any other output, or an error,
# means the commit is not on main and is not confirmed to work: run setup-ci
# again with `--sha` and a commit on main.
#
# Editing the installed workflow: `setup-ci --force` replaces the whole of a
# repository's .github/workflows/spec-check.yml, discarding any local edit,
# a hand edit of SPEC_CHECK_SHA included. It is also how to update the pin.
# An edit every repository should get goes in the template, by a pull
# request to adamstallard/shared-skills. Once it merges, pull it into a
# shared-skills clone and run `setup-ci --force` from there. That writes the
# new template, but without `--sha` the pin is still the newest commit that
# changed spec_check.py. So after a merge that left spec_check.py alone, the
# pin stays where it was: the workflow runs the new template's steps with
# the same spec_check.py as before. To pin a different commit, pass it with
# `--sha`. An edit only one repository needs can be made in its installed
# copy, but must be made again after each `setup-ci --force`.
name: spec-check
on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Every OpenSpec change was read since it last changed
        env:
          # A full commit SHA of adamstallard/shared-skills, never a branch,
          # so the script the workflow runs cannot change under it.
          SPEC_CHECK_SHA: <SPEC_CHECK_SHA>
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/adamstallard/shared-skills/$SPEC_CHECK_SHA/.agents/skills/spec-check/scripts/spec_check.py" -o "$RUNNER_TEMP/spec_check.py"
          python3 "$RUNNER_TEMP/spec_check.py" ci

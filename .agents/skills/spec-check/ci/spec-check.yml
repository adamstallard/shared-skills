# spec-check's workflow checks that every OpenSpec change on a pull
# request's branch had a consistency read after its last edit.
#
# A consistency read is a step of the spec-check skill: before a pull request
# goes to a person for review, a fresh agent reads each OpenSpec change the
# branch adds or edits against the repository's other specs and changes. The
# author then makes a commit whose `Spec-check:` trailer, printed by
# `spec_check.py sign`, names the changes read. A change under
# openspec/changes is unread when no commit on the branch records a read of
# it, or when its files differ from what they were in the newest commit that
# does.
#
# When no change is unread, the `spec-check` check passes and the pull
# request is left alone. When one is, `spec_check.py ci` acts by event type:
# - opened, reopened, ready_for_review: each puts the pull request in front
#   of a reviewer, for the first time or again. The check fails, and the
#   script makes the pull request a draft again.
# - review_requested: the same, and the script also withdraws that review
#   request.
# - synchronize (a push to the branch): the check fails, but the pull
#   request stays ready. An agent often pushes several times before doing
#   the read, and a draft on each push would flip the pull request back and
#   forth.
# A draft pull request passes on every event except review_requested; on
# that one, the check fails and the script withdraws the review request.
# When the base branch's protection rules require `spec-check`, a failed
# check blocks the merge.
#
# The script makes the draft and withdraws the request through gh, with the
# GH_TOKEN below and the `pull-requests: write` permission. Without the
# token or the permission, or on a pull request from a fork, whose token is
# read-only, the check still fails but the pull request is left as it is.
#
# Editing this file: `spec_check.py setup-ci` writes it from the template
# .agents/skills/spec-check/ci/spec-check.yml in adamstallard/shared-skills.
# `setup-ci --force`, which is how SPEC_CHECK_SHA is updated, replaces the
# whole file. A change every repository should get belongs in that template.
# A change only this repository needs can be made here, but must be made
# again after each `setup-ci --force`.
name: spec-check
on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Every OpenSpec change was read since it last changed
        env:
          # A full commit SHA of adamstallard/shared-skills, never a branch,
          # so the script the workflow runs cannot change under it.
          SPEC_CHECK_SHA: <SPEC_CHECK_SHA>
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/adamstallard/shared-skills/$SPEC_CHECK_SHA/.agents/skills/spec-check/scripts/spec_check.py" -o "$RUNNER_TEMP/spec_check.py"
          python3 "$RUNNER_TEMP/spec_check.py" ci

# spec-check's workflow checks that every OpenSpec change a pull request
# adds or edits has had a consistency read since its last edit. A
# consistency read is a step of the spec-check skill: before a pull request
# goes to a person for review, a fresh agent reads each such change against
# the repository's other specs and changes.
#
# Whoever wrote the change, a person or an agent, records that read by
# committing with a `Spec-check:` trailer, printed by `spec_check.py sign`,
# that names the changes read. The trailer is the only record of a read. A
# change the pull request adds or edits (a folder under openspec/changes)
# is unread when no commit in the history of the pull request's head has a
# trailer naming that change, or when the change's files have changed since
# the newest commit whose trailer names it.
#
# When every change has been read, the `spec-check` check passes and the
# pull request is left alone. A pull request that `spec_check.py ci` (the
# script this workflow runs) made a draft earlier stays a draft until
# someone marks it ready. When a change is unread, what the script does
# depends on the event and on whether the pull request is a draft.
#
# A ready pull request:
# - opened, reopened, ready_for_review: each puts it in front of a reviewer,
#   for the first time or again. The check fails, and the script makes the
#   pull request a draft.
# - review_requested: the same, and the script also withdraws that review
#   request.
# - synchronize (a push to the branch): the check fails, but the pull
#   request stays ready. An agent often pushes several times before doing
#   the read. If each push made the pull request a draft, the agent or a
#   person would mark it ready again, and the next push would make it a
#   draft again.
#
# A draft pull request:
# - review_requested: the check fails, and the script withdraws that review
#   request. The pull request stays a draft.
# - opened, reopened, synchronize: the check passes even with a change
#   unread, because no one is yet asked to review it. The check runs again
#   when the pull request is marked ready.
#
# When the base branch's protection rules require `spec-check`, a failed
# check blocks the merge.
#
# The script makes the draft and withdraws the request through gh, with the
# GH_TOKEN below and the `pull-requests: write` permission. Without the
# token or the permission, the check still fails but the pull request is
# left as it is. The same happens on a pull request from a fork, because
# GitHub gives the workflow only a read-only token there.
#
# Where the script comes from: each run downloads spec_check.py from
# adamstallard/shared-skills at the commit SPEC_CHECK_SHA names, below. That
# commit is the pin. The download always works at a commit on main. At a
# commit never pushed to GitHub it never works, so the check fails. At a
# commit on another branch it can stop working once that branch is
# deleted, because GitHub may stop serving a commit that no branch
# reaches. Whether it works at a commit pushed only to a fork is untested.
# So pin a commit on main; step 3 below shows how to confirm that it is.
#
# To update the pin, or this workflow:
# 1. Get a clone of adamstallard/shared-skills with main checked out,
#    clean and up to date; <clone> below is its path. Either make a fresh
#    one:
#      git clone https://github.com/adamstallard/shared-skills <clone>
#    or reuse one. If spec-check was installed with manage-skills (the
#    installer that comes with shared-skills), ~/.agents/skills/spec-check
#    is a symbolic link into a clone, and this prints that clone's path:
#      git -C ~/.agents/skills/spec-check rev-parse --show-toplevel
#    A reused clone must print nothing for `git -C <clone> status --short`,
#    and then `git -C <clone> switch main` and
#    `git -C <clone> pull --ff-only` must succeed; otherwise make a fresh
#    one.
# 2. From inside the repository that holds this workflow, run:
#      python3 <clone>/.agents/skills/spec-check/scripts/spec_check.py setup-ci --force
#    `--force` replaces the whole file, discarding any local edit; without
#    it, setup-ci refuses to replace an existing workflow and changes
#    nothing. Add `--sha <commit>` to pin a commit on main other than the
#    default, the newest commit that changed spec_check.py or the
#    template in the history of the clone's main.
# 3. Confirm that the new pin is on main, with <sha> the new SPEC_CHECK_SHA
#    value:
#      gh api repos/adamstallard/shared-skills/compare/main...<sha> --jq .status
#    It prints `behind` (the commit is an ancestor of main's head) or
#    `identical` (it is main's head) when the commit is on main. Any other
#    output, or an error, means it is not. That can happen with a reused
#    clone whose main tracks a fork rather than adamstallard/shared-skills;
#    a fresh clone has the real main. So redo step 1 with a fresh clone, or
#    pass a commit on main with `--sha`, and repeat step 2.
# 4. Commit .github/workflows/spec-check.yml.
#
# How the pin is set: `spec_check.py setup-ci` writes this workflow as
# .github/workflows/spec-check.yml into the git repository named by
# `--repo <dir>`, or else the one holding the current directory. It must
# run from a clone of adamstallard/shared-skills, and copies the workflow
# from the template (.agents/skills/spec-check/ci/spec-check.yml) as
# committed at the pin, never from the clone's working files. So the
# workflow's steps and the spec_check.py each run downloads always come
# from the same commit, and an uncommitted edit to the template never
# reaches the workflow. The pin is the newest commit that changed
# spec_check.py or that template in the history of the branch the clone
# has checked out, which step 1 makes main. So an out-of-date clone writes
# an out-of-date workflow, and a clone updated as in step 1 pins a commit
# on main. After a shared-skills
# merge that changed either file, the next setup-ci run from a clone
# updated as in step 1 moves the pin forward to that newest commit. After
# a merge that left both alone, the pin stays where it was. setup-ci
# writes nothing if the pin it picks is on none of the clone's
# remote-tracking branches. Passing that check shows only that the commit
# was pushed somewhere, perhaps to a fork or to a branch other than main.
# With `--sha <commit>` the pin is that commit instead, and setup-ci checks
# only that it is a full 40-character SHA of a commit in the clone; for a
# commit the clone lacks, it writes nothing and says to fetch it. Either
# way, setup-ci does not confirm the pin is on main, which is why step 3
# checks it.
#
# Editing this file by hand works, SPEC_CHECK_SHA included, as long as the
# pin stays a full 40-character SHA of a commit on main, but the edit lasts
# only until the next `setup-ci --force`, which discards it. An edit every
# repository should get goes in the template, by a pull request to
# adamstallard/shared-skills; once it merges, update as above.
name: spec-check
on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Every OpenSpec change was read since it last changed
        env:
          # The pin, which setup-ci writes here: a full commit SHA of
          # adamstallard/shared-skills, never a branch, so the script the
          # workflow runs cannot change under it.
          SPEC_CHECK_SHA: <SPEC_CHECK_SHA>
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/adamstallard/shared-skills/$SPEC_CHECK_SHA/.agents/skills/spec-check/scripts/spec_check.py" -o "$RUNNER_TEMP/spec_check.py"
          python3 "$RUNNER_TEMP/spec_check.py" ci

# Guidance for agents that write OpenSpec changes through OpenSpec's
# workflow skills.
# When a repository's agents write changes that way, merge the `rules:` block
# below into its openspec/config.yaml by hand. Merge it again whenever this
# file changes, replacing the rules merged last time, which end each of
# config.yaml's lists, since the merge appends them. If config.yaml already has a `rules:` key, add these lists to it,
# and where it already has a list for an artifact, such as `proposal`,
# append these rules to that list.
# Rules that several lists share are written once, in `proposal`, each
# marked with a YAML anchor (`&name`). The other lists repeat them by alias
# (`*name`). YAML resolves an alias only to an anchor above it, so in the
# merged file `proposal` must come before `specs` and `design`: move it up
# if config.yaml lists either of them first. If config.yaml already uses
# one of these anchor names, rename the clashing anchor, and its aliases,
# in the copy you merge.
# `openspec instructions <artifact>` shows each
# list to the agent writing that artifact, so the rules reach agents that
# never load spec-check. To those agents the rules are advice. spec-check
# enforces them on every change it checks, whoever wrote the change,
# through its checks and its consistency read (a subagent's read of a
# change against every other spec). spec-check's SKILL.md, section Decision
# records, defines the entry kinds and formats the rules refer to.
rules:
  proposal:
    - &record-kinds A decision record is a capability's decisions.md. It holds entries of three kinds (Constraint, Rejected and Rationale), defined in spec-check's SKILL.md, section Decision records; the rules on evidence and on a record's format, which follow this one, repeat SKILL.md's evidence definition and record format, for an agent without SKILL.md. A capability's record is at openspec/specs/<capability>/decisions.md, unless openspec/spec-check.yaml has a decision-records key whose value is a path pattern with <capability> in it; the record is then at that pattern, relative to the repository root. In either path, <capability> stands for the capability's name, which is the path of its folder under openspec/specs, such as user-auth or identity/user-auth; for a capability the change adds, the name is the path of its folder under the change's specs folder. Edit the record file at that path, in the pull request that carries the change, even for a capability the change adds; never put a copy inside the change's folder. Create the file and any folders it needs when it is missing.
    - &evidence Evidence, which every decision-record entry rests on, is a failure (the bug or incident itself), a measurement (an experiment someone ran) or an outside fact (such as a standard or a vendor's documentation). In an entry, each piece of evidence ends in a link to its source, which is a URL, an issue or pull request, a commit, or a markdown link to a file in the repository. For a failure, a link to its regression test may come after the source link, as a pointer and not as evidence. A test is never evidence, not even a requirement's own test, since it shows the rule is enforced, not why it is needed.
    - &record-format A decision record's first line is a level-1 heading holding the capability's name, a colon, a space, and then the phrase "constraints, rejected alternatives and rationale" exactly as quoted. Its entries sit under level-2 headings named exactly Constraints, Rejected and Rationale, in that order, each used at most once; leave out a heading with no entries. Each entry is a list item starting with a hyphen. The entry's whole first line is bold and holds its kind (Constraint, Rejected or Rationale), a colon, a space, its title and a closing period, all inside the bold. A Constraint's title names the rule, and a Rejected entry's title names the approach. A Rationale entry's title is its requirement's name exactly as the spec's heading gives it after the word Requirement and its colon; for a name that already ends in a period, write two periods, the name's own and the closing one. The rest of the entry is on lines indented under the first, and a blank line ends the entry. A labelled line is the label in plain text, a colon and its text, and may wrap onto further indented lines with no blank line between them. A Constraint entry has, in this order, one line each labelled Because (the rule's reason in one sentence), Evidence (a single line holding all of the entry's pieces of evidence, separated by semicolons, which may wrap), Holds while (the condition under which the rule still holds) and Paths (the files, directories or globs it governs, relative to the repository root and separated by commas). A Rejected entry has, in this order, one line each labelled Facing (the problem the approach tried to solve), Lost because (one sentence a reader can check, ending in a link to each piece of its evidence; a Rejected entry has no Evidence line), Instead (what was chosen) and Paths. A Rationale entry has its reasoning first, as unlabelled indented lines with no blank line between them, then one line labelled Evidence for each piece, unlike a Constraint entry's single Evidence line, and no Paths line. A Rationale entry goes only in the record of its requirement's capability, and a requirement has at most one.
    - &dead-evidence Whoever reads a record entry while doing a change removes each piece of its evidence that is dead (its link no longer resolves) or disproved; you need not look through entries you have no reason to read. Delete the entry when no sound evidence is left or when it no longer holds, which is when a Constraint entry's Holds while condition has ended, a Rejected entry's Lost because no longer applies, or a Rationale entry's requirement is gone. Give the reason for each removal or deletion in the commit message, never in a file of the change or in the record. Rewording an entry is not deleting it; it needs no reason, and the entry keeps its evidence.
    - &no-history In any file of the change and in a decision record, never name who made a decision or when it was made, and never describe earlier drafts or review rounds of the change. A date of a fact, such as when a measurement was taken, may appear.
    - Before proposing an approach, read the spec and the decision record of each capability the change touches. A capability may have no record yet, and a capability the change adds has neither a spec nor a record until this pull request creates them. Only two kinds of entry stand against an approach, a Rejected entry that turns the approach down and a Constraint entry whose rule the approach would break; a requirement the approach would break is covered by the rule below that starts "If the approach breaks a requirement".
    - If a Rejected or Constraint entry stands against the approach, narrow that entry in the pull request that carries this proposal, so that the approach falls outside it (outside a Constraint's rule, or outside the approach a Rejected entry names), with evidence for its new form. Delete the entry instead if it no longer holds or has no evidence, since an entry without evidence does not belong in a record. If you can neither narrow nor delete the entry, change the approach.
    - If the approach breaks a requirement, change or remove the requirement through the delta specs; the delta spec holds no evidence, since a requirement's reasons and evidence live in its Rationale entry. Then, if the requirement has a Rationale entry, rewrite the entry with evidence for its new form, or delete it if the requirement is removed, the entry no longer holds, or you have no evidence for its new form (the old entry gives reasons for the requirement's old form, so it cannot stay).
    - Give the reason for each deletion, of a record entry or of a requirement, in the commit message, with the evidence for it when there is any. Removing a requirement and its scenarios with no evidence needs no record entry.
    - proposal.md is a stub, written once and never regenerated. It holds a Why section of at least 50 characters and a What Changes section of one bullet, the least that keeps OpenSpec's show, status and archive commands from warning, plus any Builds on lines. It holds no evidence, decisions or reasoning, and no agent reads it as a source for a spec or for code. Reasoning without evidence, such as about a design choice or a turned-down approach, is written nowhere, in the change or in a record, since only evidence protects a decision from reversal.
    - Evidence never goes in proposal.md. Evidence for a requirement (a rule in a spec, with a scenario a test checks) goes in that requirement's Rationale entry, which you create if it is missing. Evidence for a rule no test can check, which is never written as a requirement, goes in a Constraint entry in the record of each capability the rule governs. Evidence about a turned-down approach a test could catch (one that would make some test fail if someone used it) goes in the Rationale entry of the requirement whose scenario the approach would fail; if no requirement has such a scenario yet, add one through the delta specs. Evidence about a turned-down approach no test could catch goes in a Rejected entry in the record of each capability the approach concerns. Evidence for the change itself rather than for a lasting rule, such as the issue that prompted it, goes in the commit message. Create each record that is missing, at the record path given by the rule that defines a decision record, even for a capability the change adds.
    - When the change modifies, removes, renames or relies on a requirement that another open change adds, renames or rewrites, name that change in a Builds on line in proposal.md, since only then does spec-check check this change against the specs as that other change leaves them. Write one such line per change it builds on, right after proposal.md's level-1 title and before its Why section. Each line holds, with no markup and nothing else, the words Builds on followed by a colon, a space, that change's folder name under openspec/changes, a space, and that change's pull request in this repository, in parentheses as <owner>/<repo>#<number>. List the lines in the order the changes apply to main, so that a change comes after any change it builds on. Delete a line once your branch holds that change's result, as it does after that change merges and you merge main into your branch.
  specs:
    - *record-kinds
    - *evidence
    - *record-format
    - *dead-evidence
    - *no-history
    - A rule a test could check is a requirement with a scenario that checks it. To rule out an approach a test could catch (one that would make some test fail if someone used it), add a scenario the approach would fail. Put it under the requirement the approach breaks, or, if no requirement covers the behaviour the approach would get wrong, under a new requirement stating the behaviour chosen instead. Such an approach never gets a Rejected entry.
    - Evidence for a requirement, including evidence for ruling out an approach a test could catch, goes in that requirement's Rationale entry, in the decision record of the requirement's capability; add to the entry if it exists, or create it. When the change renames a requirement, retitle its Rationale entry to the new name; when the change removes a requirement, delete its Rationale entry. Edit the record directly in the pull request that carries the change, creating it at the record path given by the rule that defines a decision record if it is missing, even for a capability the change adds; the change's own folder never holds a decisions.md.
    - A rule no test can check, such as a cost policy or a choice of tool, is never a requirement. With evidence, such a rule is a Constraint entry, and an approach no test could catch is a Rejected entry; either one is copied whole into the record of each capability it governs or concerns, never linked from one record to another. Without evidence, such a rule or approach is not written down.
    - A requirement may state one plain reason, with no evidence or link, beside its SHALL statement, as a because clause or as the sentence right after it, even when the same reason has evidence in a Rationale entry. Further reasoning without evidence, including why a testable approach was ruled out, is not written down. When the change removes a requirement, with its scenarios, and has no evidence for removing it, the removal needs no record entry; the commit message gives a one-line reason for the deletion.
  design:
    - *no-history
    - design.md holds only open questions for a person, which are the questions an agent must not decide. Create it when the first such question arises and delete it when the last is answered, writing each answer as a requirement with a scenario, as a decision-record entry when it has evidence, or nowhere. It holds no decisions, reasoning or record entries, and no agent reads anything in it but its open questions. A need this change has of another open change, such as an interface the other must provide, goes in the other change's issue body, opened if it has none, since that body is read before that change's work starts.

schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  proposal:
    - Before proposing an approach, read the decision record (decisions.md) of each capability the change touches, and do not bring back an approach it rejects.
  specs:
    - A rule or rejection a test can check is a requirement with a scenario, not a decision-record entry; an evidenced reason for that requirement goes in its Rationale entry.
    - A requirement holds its SHALL statement and at most one because sentence; a reason with evidence goes in a Rationale entry, however short, in the capability's decision record (decisions.md beside its main spec, unless openspec/spec-check.yaml puts it elsewhere), edited directly in the same pull request; a change holds no decisions.md of its own.
  design:
    - A constraint no test can check, an alternative turned down, or a reason for a requirement, each with its evidence, goes only in the capability's decisions.md, edited in the same pull request, never in design.md; design.md may link to the record entry.
    - Each decision needs linked evidence - a failure (the bug or incident itself, linked, with its regression test as a further pointer), a measurement (an experiment someone ran), or an outside fact. A test alone never shows why a rule is needed. Purely logical reasoning with none of these stays in design.md.
    - The requirement's own test is not evidence for it, since it shows the rule is enforced, not why it is needed.
    - A rejection that a requirement guards against (one its scenario would fail) is written as that requirement's Rationale, with evidence. Otherwise it is a Rejected entry whose Lost because links evidence, or it is deleted from the record.
    - Never give who decided, or when, as a reason.
